[package]
name = "nocowboy-daemon"
version = "0.1.0"
edition = "2021"
description = "NoCowboy continuous consciousness daemon"

[dependencies]
notify = { version = "6", features = ["macos_kqueue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ed25519-dalek = "2"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
